set -g history-limit 90000

set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB:usstyle'  # kitty: truecolor + undercurl/underline colour
set -as terminal-features ',tmux*:RGB:usstyle'        # nested: remote tmux talking to this tmux over ssh
set-environment -g COLORTERM truecolor                 # ssh doesn't forward COLORTERM

set -g theme terminal

set-option -g focus-events on
set -s escape-time 10
set -g mouse on

# kitty images
set -gq allow-passthrough on
set -g visual-activity off

set -g default-shell $SHELL

# Set ctrl+a as prefix, except on airingpot (used nested over ssh, keeps the default C-b)
%if "#{!=:#{host_short},airingpot}"
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
%endif

bind r source-file ~/.config/tmux/tmux.conf

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

set -g status-left-length 40

# different status bar on airingpot so the nested remote tmux stands out (ANSI magenta = iris in the kitty palette)
%if "#{==:#{host_short},airingpot}"
set -g status-style bg=magenta,fg=black
%endif
set -g window-status-current-style default  # tmux 3.8 underlines the current window by default

# pre-3.8 look: 3.8 added grey backgrounds/boxes to tree mode, popups, menus and borders
set -g tree-mode-border-style default
set -g display-panes-border-style default
set -g popup-style default
set -g popup-border-style default
set -g menu-style default
set -g menu-border-style default
set -g pane-border-style default
set -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=green}}"


bind-key v select-window -t nvim

# kills current session and switches some other
bind-key X run-shell 'tmux switch-client -n \; kill-session -t "#S"'

bind-key -r f run-shell "tmux neww ~/.config/personal/scripts/tmux-sessionizer"
bind-key -r F run-shell "tmux neww ~/.config/personal/scripts/tmux-sessionizer"

bind-key -r D run-shell "~/.config/personal/scripts/tmux-sessionizer ~/projects/dotfiles"
bind-key -r S run-shell "~/.config/personal/scripts/tmux-sessionizer ~/projects/sandbox"
bind-key -r V run-shell "~/.config/personal/scripts/tmux-sessionizer ~/projects/dotfiles/dot-config/nvim"
